name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish UI/UI.csproj -c Release -o release

      # Source uses base href "/" so `dotnet run` works locally;
      # GitHub Pages serves the site under /job-tracker/.
      - name: Rewrite base href for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/job-tracker/" />|' release/wwwroot/index.html release/wwwroot/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release/wwwroot
